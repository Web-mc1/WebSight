<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Info Diagnostic</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .info-card { background: #f4f4f9; padding: 15px; border-radius: 8px; max-width: 500px; }
    </style>
</head>
<body>

    <h2>Your System Diagnostics</h2>
    <div class="info-card">
        <p><strong>Browser Info:</strong> <span id="user-agent"></span></p>
        <p><strong>Screen Resolution:</strong> <span id="screen-res"></span></p>
        <p><strong>CPU Cores:</strong> <span id="cpu-cores"></span></p>
        <p><strong>Language:</strong> <span id="language"></span></p>
    </div>

    <script>
        // Reads standard public browser properties
        document.getElementById('user-agent').textContent = navigator.userAgent;
        document.getElementById('screen-res').textContent = `${window.screen.width} x ${window.screen.height}`;
        document.getElementById('cpu-cores').textContent = navigator.hardwareConcurrency || "Unavailable";
        document.getElementById('language').textContent = navigator.language;
    </script>

</body>
</html>
